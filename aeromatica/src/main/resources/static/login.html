<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aeromática</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/css/global.css">

    <script src="/script/login.js" defer></script>
</head>
<body class="login-body">
    <nav class="area-nav">
        <span class="titulo">
            <p class="nav-title">AEROMÁTICA</p>
            <p>O Jogo Matemático de Administração de Aeroportos</p>
        </span>
        <a href="#" class="initial">O JOGO</a>
        <a href="#">RANKING</a>
        <a href="#">MÍDIA</a>
        <a href="#">EQUIPE</a>
        <a href="#" class="btn-nav">DOWNLOAD <i class="fa-solid fa-download"></i></a>
        <a href="login.html" class="login-icon"><i class="fa-regular fa-circle-user"></i></a>
    </nav>
    <div class="background-container">
        <main class="login-container">
            <form action="/auth/login" method="post" class="form-login" id="form">
                <label for="username"><i class="fa-solid fa-circle-user"></i> Usuário: </label>
                <input type="text" id="username" name="username" placeholder="Digite seu nome de usuário">
                
                <label for="email"><i class="fa-solid fa-envelope"></i> Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>

                <label for="password"><i class="fa-solid fa-lock"></i>Senha:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                        <i class="fa-solid fa-eye toggle-icon" id="showPassword"></i>
                        <i class="fa-solid fa-eye-slash toggle-icon hide" id="hidePassword"></i>
                </div>
                <a href="#" class="forgot-password">Esqueci minha senha</a>
                <p>Não possui uma conta? <a href="register.html" id="btn-register">Cadastre-se</a></p>

                <button type="submit" class="btn-sec">Entrar</button>
            </form>
            <p id="message"></p>
        </main>
    </div>
</body>
</html>
